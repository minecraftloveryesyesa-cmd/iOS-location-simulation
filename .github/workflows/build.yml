name: Build versioned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "アプリのバージョン (例: 1.0.1)"
        required: true
        default: "1.0.1"
        type: string
      publish_release:
        description: "GitHub Release に .ipa 単体を添付する"
        required: true
        default: true
        type: boolean
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "ipa_name=LocationLab-v$VERSION.ipa" >> "$GITHUB_OUTPUT"

      - name: Checkout Shift dependency
        uses: actions/checkout@v4
        with:
          repository: N3moStudio/Shift
          ref: main
          path: Shift-source
          persist-credentials: false

      - name: Stage native idevice dependency
        run: |
          mkdir -p Vendor
          cp -R Shift-source/Vendor/idevice Vendor/idevice
          test -f Vendor/idevice/idevice.h
          test -f Vendor/idevice/module.modulemap
          test -f Vendor/idevice/libidevice_ffi.a
          file Vendor/idevice/libidevice_ffi.a

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project LocationSimulationLab.xcodeproj \
            -scheme LocationSimulationLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            MARKETING_VERSION="${{ steps.version.outputs.value }}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package standalone IPA file
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/LocationSimulationLab.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/zip -qry "${{ steps.version.outputs.ipa_name }}" Payload
          test -s "${{ steps.version.outputs.ipa_name }}"
          /usr/bin/unzip -l "${{ steps.version.outputs.ipa_name }}" | head -30

      # GitHub Actions artifacts are downloaded as ZIP containers.
      # This release asset is the raw .ipa file, not a ZIP wrapper.
      - name: Upload versioned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationLab-v${{ steps.version.outputs.value }}-IPA
          path: ${{ steps.version.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish raw IPA as a GitHub Release asset
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Location Lab v${{ steps.version.outputs.value }}
          files: ${{ steps.version.outputs.ipa_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
